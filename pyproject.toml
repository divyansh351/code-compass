[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-compass"
version = "0.1.0"
description = "Local-First Agent Knowledge Framework and MCP Server for Software Repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Code Compass Contributors" }
]
keywords = ["mcp", "ai-agents", "knowledge-graph", "code-analysis", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "networkx>=3.3",
    "mcp>=1.0.0",
    "rich>=13.7.0",
    "tree-sitter>=0.26",
    "tree-sitter-language-pack>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
ollama = [
    "httpx>=0.27.0",
]

[project.scripts]
compass = "compass.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
