project:
  name: code-compass
  description: "Local-First Agent Knowledge Framework and MCP Server"
  version: 0.1.0

source:
  path: .
  ignore_patterns:
    - ".git"
    - "node_modules"
    - ".venv"
    - "venv"
    - "__pycache__"
    - "dist"
    - "build"
    - "coverage"
    - ".env"
    - ".pytest_cache"
    - "knowledge"

knowledge:
  path: ../code-compass-knowledge

analysis:
  languages:
    - python
  files: true
  imports: true
  symbols: true
  git_history: true
  max_git_commits: 100
